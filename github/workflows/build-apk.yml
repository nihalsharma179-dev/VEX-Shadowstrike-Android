name: Build VEX Shadowstrike APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded ZIP
        run: |
          test -f VEX_Shadowstrike_Android_Phone_Build.zip

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q VEX_Shadowstrike_Android_Phone_Build.zip -d build-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build-src/VEX_Shadowstrike_Android_CloudBuild/VEX_Shadowstrike_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEX-Shadowstrike-APK
          path: build-src/VEX_Shadowstrike_Android_CloudBuild/VEX_Shadowstrike_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
